services:
  postgres:
    image: postgres:17-alpine
    container_name: handoff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Только localhost: бэк на хосте подключается, из сети база не видна
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - handoff-pgdata:/var/lib/postgresql/data
      # Скрипты отсюда выполняются один раз, при первом запуске на пустом томе
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  handoff-pgdata:
