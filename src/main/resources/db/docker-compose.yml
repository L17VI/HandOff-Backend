  rustfs:
    image: rustfs/rustfs:latest
    container_name: handoff_rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: miniosecretpassword
    ports:
      - "9000:9000"
    volumes:
      - rustfs_data:/data
      
