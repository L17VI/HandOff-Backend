services:
  postgres:
    image: postgres:16-alpine
    container_name: handoff_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: handoff_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

